name: Actualizar archivo de prensa

on:
  schedule:
    - cron: '7 * * * *' # cada hora, al minuto 7 (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar titulares
        run: node scripts/fetch-news.mjs
      - name: Commit si hay novedades
        env:
          COMMIT_NAME: ${{ vars.COMMIT_NAME }}
          COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL }}
        run: |
          if git diff --quiet -- data/news.json; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "${COMMIT_NAME:-github-actions[bot]}"
          git config user.email "${COMMIT_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
          git add data/news.json
          git commit -m "prensa: actualización automática $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
